# Approves pull requests that bots open (Dependabot, the release bot) once the unit tests have passed, and nothing else.
# It replaces pull-request-automation.yml, which approved every pull request that was not opened by masgeek the moment it was
# opened, without waiting for any check. Human pull requests need a human review.
name: Auto Approve PR

on:
  workflow_run:
    workflows: ["UnitTests"]
    types: [completed]

concurrency:
  group: auto-approve-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

# Bots whose pull requests may be auto-approved, separated by spaces. Write the bare name: `github-actions[bot]`,
# `app/github-actions` and `GitHub-Actions` are all matched by `github-actions` (see the check below). To change the list
# without editing this file, set a repository variable called ALLOWED_BOTS.
env:
  ALLOWED_BOTS: ${{ vars.ALLOWED_BOTS || 'github-actions dependabot munywele-bot' }}

jobs:
  pr-auto-approve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Gate everything here, in one place, at the job level.
    # - only react to PR-triggered runs that succeeded
    # - only react to runs from the base repo (never a fork's copy of
    #   the workflow — a fork PR could edit "UnitTests" to always pass,
    #   and workflow_run inherits write perms against the base repo)
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Get PR details
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          PR_NUMBER=$(gh pr list \
            --repo "${{ github.repository }}" \
            --search "${{ github.event.workflow_run.head_sha }}" \
            --state all \
            --json number \
            --jq '.[0].number // empty')

          if [ -z "$PR_NUMBER" ]; then
            echo "No PR found for commit ${{ github.event.workflow_run.head_sha }} — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "author=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json author --jq '.author.login')" >> "$GITHUB_OUTPUT"
          echo "author_is_bot=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json author --jq '.author.is_bot')" >> "$GITHUB_OUTPUT"

      - name: Check author is an allowed bot
        if: steps.pr.outputs.skip != 'true'
        id: gate
        env:
          PR_AUTHOR: ${{ steps.pr.outputs.author }}
          AUTHOR_IS_BOT: ${{ steps.pr.outputs.author_is_bot }}
        run: |
          # The same bot is spelled `name[bot]` in some places and `app/name` in others, in any letter case. Compare the bare
          # name on both sides, so no spelling is skipped by mistake.
          bare() {
            local s="${1,,}"
            s="${s#app/}"
            s="${s%\[bot\]}"
            printf '%s' "$s"
          }

          author="$(bare "$PR_AUTHOR")"
          read -ra bots <<< "$ALLOWED_BOTS"
          allowed=false

          # GitHub must also say the author is a bot, so a person who shares a bot's name can never match
          if [ "$AUTHOR_IS_BOT" = "true" ]; then
            for bot in "${bots[@]}"; do
              if [ "$author" = "$(bare "$bot")" ]; then
                allowed=true
                break
              fi
            done
          fi

          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"

          if [ "$allowed" = "true" ]; then
            echo "Author '$PR_AUTHOR' is allowed."
          else
            echo "Author '$PR_AUTHOR' (bot: $AUTHOR_IS_BOT) is not an allowed bot, skipping."
          fi

      - name: Generate GitHub App Token
        if: steps.gate.outputs.allowed == 'true'
        id: generate-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Auto approve PR
        if: steps.gate.outputs.allowed == 'true'
        uses: hmarr/auto-approve-action@v4.0.0
        with:
          review-message: "Auto approved: the unit tests passed"
          # This runs after another workflow, not on a pull_request event, so the action must be told which pull request to approve
          pull-request-number: ${{ steps.pr.outputs.number }}
          github-token: ${{ steps.generate-token.outputs.token }}
