name: Deploy

# Deploys the branch to its server in three jobs (kept few so the run graph
# stays readable):
#
#   Plan -> Deploy to server -> Tag release (beta tags are "beta-" pre-releases)
#
# "Deploy to server" runs these steps in order: update code and packages,
# pull runtime data (optional), restart the service, check health.
#
# Called by CI (ci.yml) after every check has passed, so it runs this file's
# version from the pushed branch. Plan matches the branch to a target in
# .github/deploy-targets.json (main -> production, experimental -> beta); any
# other branch stops after Plan. The wait for more pushes happens in CI, before
# the checks, so it is not repeated here.
#
# It can also be run by hand ("Run workflow" on a deploy branch), e.g. with
# setup_data ticked to pull the runtime data from OSF. A manual run does NOT
# run the R checks: CI already ran them on the push that made the commit.
on:
  workflow_call:
    inputs:
      setup_data:
        description: "Pull runtime data from OSF before restarting"
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      setup_data:
        description: "Pull runtime data from OSF before restarting"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Work out whether this run deploys, and where to
  # ---------------------------------------------------------------------------
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    outputs:
      deploy: ${{ steps.pick.outputs.deploy }}
      target: ${{ steps.pick.outputs.target }}
      app_dir: ${{ steps.target.outputs.app_dir }}
      service_name: ${{ steps.target.outputs.service_name }}
    steps:
      - name: Check out deploy settings
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github

      - name: Match branch to a deploy target
        id: pick
        env:
          BRANCH: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          target=$(jq -r --arg b "$BRANCH" \
            'to_entries[] | select(.value.branch == $b) | .key' \
            .github/deploy-targets.json | head -n1)

          # Inside a call from CI, github.event_name is CI's own event (push)
          deploy=false
          if [ -n "$target" ] && { [ "$EVENT" = "push" ] || [ "$EVENT" = "workflow_dispatch" ]; }; then
            deploy=true
          fi

          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

          if [ "$deploy" = "true" ]; then
            echo "### Deploying \`$BRANCH\` to **$target**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### No deploy for \`$BRANCH\` ($EVENT)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Look up folder and service
        id: target
        if: steps.pick.outputs.deploy == 'true'
        uses: ./.github/actions/resolve-target
        with:
          target: ${{ steps.pick.outputs.target }}
          # Production-only overrides, kept from the previous workflow
          app_dir_override: ${{ steps.pick.outputs.target == 'production' && vars.APP_DIR_OVERRIDE || '' }}
          service_override: ${{ steps.pick.outputs.target == 'production' && vars.SERVICE_NAME_OVERRIDE || '' }}

  # ---------------------------------------------------------------------------
  # All server work in one job, so the run graph stays compact. The steps run
  # strictly in order, and the per-target lock keeps two runs from working on
  # the same server at once.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to server
    needs: [ plan ]
    if: >-
      !cancelled() &&
      needs.plan.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    concurrency:
      group: server-${{ needs.plan.outputs.target }}
      cancel-in-progress: false
    steps:
      - name: Check out actions
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github

      - name: Update code and install R packages
        uses: appleboy/ssh-action@v1.2.5
        env:
          APP_DIR: ${{ needs.plan.outputs.app_dir }}
          BRANCH: ${{ github.ref_name }}
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          envs: APP_DIR, BRANCH
          script: |
            set -e
            cd "$APP_DIR"

            echo "Updating $APP_DIR to $BRANCH..."
            # These files used to come only from the data bundle (or were copied by
            # hand); they are now tracked in git, so an untracked copy would block the pull
            for f in data/input/translations.csv data/input/fertilizer_npk.csv; do
              if [ -f "$f" ] && ! git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
                echo "Replacing the untracked $f with the tracked one"
                rm -f "$f"
              fi
            done
            git fetch origin
            git checkout "$BRANCH"
            git pull origin "$BRANCH"

            echo "Cleaning temp folder..."
            rm -rf "$APP_DIR"/temp/*

            # The price database is kept: on start the API migrates it and
            # updates it from the seed CSVs without losing refreshed prices

            # Exits non-zero if any package fails, which stops the deploy here
            echo "Installing R packages..."
            sudo Rscript install_packages.R

            # Derived data that is not in the OSF bundle, e.g. the Rwanda
            # scheduled-planting file; does nothing if it is built or can't be yet
            sh tools/ensure_sp_files.sh

      # Optional (setup_data). After the code update so it uses the latest
      # scripts/, and before the restart so the API loads the new data.
      - name: Pull runtime data (optional)
        if: inputs.setup_data
        uses: ./.github/actions/pull-data
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          app_dir: ${{ needs.plan.outputs.app_dir }}
          osf_node_id: ${{ secrets.OSF_NODE_ID }}

      - name: Restart service
        uses: appleboy/ssh-action@v1.2.5
        env:
          SERVICE_NAME: ${{ needs.plan.outputs.service_name }}
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: SERVICE_NAME
          script: |
            set -e
            sudo systemctl daemon-reload
            sudo systemctl restart "$SERVICE_NAME"
            echo "Restarted $SERVICE_NAME"

      - name: Check health (GET /health on the service's own port, up to 180s)
        uses: appleboy/ssh-action@v1.2.5
        env:
          APP_DIR: ${{ needs.plan.outputs.app_dir }}
          SERVICE_NAME: ${{ needs.plan.outputs.service_name }}
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 5m
          envs: APP_DIR, SERVICE_NAME
          script: |
            cd "$APP_DIR"

            # The API takes a while to load its data. The script finds the port the
            # service itself listens on (its systemd cgroup, then ss) and accepts a
            # /health answer only from there, so another instance answering on the
            # port this one was meant to use cannot make a crashed service look
            # healthy; see tools/check_health.sh
            sh tools/check_health.sh "$SERVICE_NAME" "$APP_DIR" 180

  # ---------------------------------------------------------------------------
  # Release: every deploy target, once the deploy is healthy. main and
  # experimental are separate lines of work that will not be merged, so each
  # keeps its own version sequence: production tags are plain (1.2.3), beta
  # tags carry a "beta-" prefix (beta-1.2.3) and are published as pre-releases.
  # ---------------------------------------------------------------------------
  tag:
    name: Tag release
    needs: [ plan, deploy ]
    # Only after the deploy job, which includes the health check, succeeded
    if: >-
      !cancelled() &&
      needs.plan.outputs.deploy == 'true' &&
      needs.deploy.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: tag-release-${{ needs.plan.outputs.target }}
      cancel-in-progress: false
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # lets the tag action fall back to local git history

      # v7 runs on Node 24 (the old masgeek fork pinned to @release was a
      # Node 16 build of upstream 6.1). Commits without a recognised type,
      # like the gitmoji-prefixed ones here, still get the default patch bump.
      - name: Work out the next version tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # The branch being deployed is the release branch (main or experimental)
          release_branches: ${{ github.ref_name }}
          # cond && 'beta-' || '' (not the other way round: '' is falsy)
          tag_prefix: ${{ needs.plan.outputs.target != 'production' && 'beta-' || '' }}
          create_annotated_tag: true

      - name: Publish the GitHub release
        if: steps.tag_version.outputs.new_tag != ''
        uses: ncipollo/release-action@v1.21.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: Version ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
          # Beta releases never become the repository's "latest" release
          makeLatest: ${{ needs.plan.outputs.target == 'production' }}
          prerelease: ${{ needs.plan.outputs.target != 'production' }}
          allowUpdates: true
          generateReleaseNotes: true
          skipIfReleaseExists: false
