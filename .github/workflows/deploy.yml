name: Deploy (reusable)

# Shared deploy pipeline for every target. Called by deploy-production.yml
# and deploy-experimental.yml; target values live in .github/deploy-targets.json.
on:
  workflow_call:
    inputs:
      target:
        description: "Key in .github/deploy-targets.json (production | beta)"
        type: string
        required: true
      setup_data:
        description: "Pull runtime data (setup-zenodo-data.yml) before deploying"
        type: boolean
        required: false
        default: false
      data_source:
        description: "Data source when setup_data is true (osf | zenodo)"
        type: string
        required: false
        default: "osf"

permissions:
  contents: read

env:
  QUIET_PERIOD: "60" # seconds to wait after last commit

# The jobs run one after another, never side by side:
#   wait (debounce) -> ci (all checks) -> setup-data (optional) -> deploy
# Nothing reaches the server until every check has passed.
jobs:
  # Debounce: a newer push cancels this wait, and with it this run's CI and
  # deploy. Kept separate from the deploy job so an in-progress deploy is never
  # cancelled.
  wait:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ inputs.target }}-wait
      cancel-in-progress: true
    steps:
      - name: Smart debounce wait
        env:
          COMMIT_TIME: ${{ github.event.head_commit.timestamp }}
        run: |
          if [ -z "$COMMIT_TIME" ]; then
            echo "Manual run — no wait needed."
            exit 0
          fi
          elapsed=$(( $(date +%s) - $(date -d "$COMMIT_TIME" +%s) ))
          wait_time=$((QUIET_PERIOD - elapsed))

          if [ $wait_time -gt 0 ]; then
            echo "Last commit was ${elapsed}s ago — waiting ${wait_time}s..."
            sleep $wait_time
          else
            echo "Last commit was ${elapsed}s ago — no wait needed."
          fi

  ci:
    needs: [ wait ]
    uses: ./.github/workflows/ci.yml

  setup-data:
    if: inputs.setup_data
    needs: [ ci ]
    uses: ./.github/workflows/setup-zenodo-data.yml
    with:
      target: ${{ inputs.target }}
      source: ${{ inputs.data_source }}
    secrets: inherit

  deploy:
    needs: [ wait, ci, setup-data ]
    # Run only when the wait and every CI check passed, and data setup passed
    # or was not requested
    if: >-
      !cancelled() &&
      needs.wait.result == 'success' &&
      needs.ci.result == 'success' &&
      (needs.setup-data.result == 'success' || needs.setup-data.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Only one deployment per target at a time; never cancel one that has started
    concurrency:
      group: deploy-${{ inputs.target }}
      cancel-in-progress: false

    steps:
      - name: Checkout deploy config
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Resolve target
        id: target
        uses: ./.github/actions/resolve-target
        with:
          target: ${{ inputs.target }}
          # Production-only overrides, kept from the previous workflow
          app_dir_override: ${{ inputs.target == 'production' && vars.APP_DIR_OVERRIDE || '' }}
          service_override: ${{ inputs.target == 'production' && vars.SERVICE_NAME_OVERRIDE || '' }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.4
        env:
          APP_DIR: ${{ steps.target.outputs.app_dir }}
          BRANCH: ${{ steps.target.outputs.branch }}
          SERVICE_NAME: ${{ steps.target.outputs.service_name }}
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          envs: APP_DIR, BRANCH, SERVICE_NAME
          script: |
              set -e

              echo "Deploying branch: $BRANCH to $APP_DIR (service: $SERVICE_NAME)"

              cd "$APP_DIR"
              git fetch origin
              git checkout "$BRANCH"
              git pull origin "$BRANCH"

              # Cleanup
              echo "Cleaning temp folder..."
              rm -rf "$APP_DIR"/temp/*

              echo "Removing old SQLite database files..."
              find . -type f -name 'akilimo_compute*.sqlite*' -exec rm -f {} \;

              echo "Installing R packages..."
              sudo Rscript install_packages.R

              # Reload services
              sudo systemctl daemon-reload
              sudo systemctl restart "$SERVICE_NAME"

              # Health check — the API takes a while to load its data
              PORT=$(grep -E '^API_PORT=' .env 2>/dev/null | tail -n1 | cut -d= -f2 | tr -d '"'"'"' \r')
              PORT=${PORT:-8000}
              echo "Waiting for http://127.0.0.1:$PORT/health ..."
              for i in $(seq 1 36); do
                if curl -fsS "http://127.0.0.1:$PORT/health" >/dev/null 2>&1; then
                  echo "Service healthy after ~$((i * 5))s"
                  echo "Deployment completed successfully"
                  exit 0
                fi
                sleep 5
              done

              echo "ERROR: $SERVICE_NAME did not become healthy within 180s"
              sudo systemctl status "$SERVICE_NAME" --no-pager || true
              sudo journalctl -u "$SERVICE_NAME" -n 50 --no-pager || true
              exit 1
