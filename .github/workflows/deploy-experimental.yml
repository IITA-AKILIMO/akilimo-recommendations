name: SSH service deployment (beta)

on:
  push:
    branches: [ "experimental" ]
    paths:
      - 'R/**'
      - 'api.R'
      - 'tests/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_DIR: "/home/akilimo/projects/akilimo-beta"
  SERVICE_NAME: "akilimo-api-beta.service"
  QUIET_PERIOD: "60" # seconds to wait after last commit

# Ensure only one beta deployment runs at a time
concurrency:
  group: deploy-beta
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Smart debounce wait
        run: |
          last_commit_time=$(git log -1 --format=%ct)
          current_time=$(date +%s)
          elapsed=$((current_time - last_commit_time))
          wait_time=$((QUIET_PERIOD - elapsed))

          if [ $wait_time -gt 0 ]; then
            echo "Last commit was ${elapsed}s ago — waiting ${wait_time}s..."
            sleep $wait_time
          else
            echo "Last commit was ${elapsed}s ago — no wait needed."
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.4
        env:
          APP_DIR: ${{ env.APP_DIR }}
          BRANCH: ${{ github.ref_name }}
          SERVICE_NAME: ${{ env.SERVICE_NAME }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: APP_DIR, BRANCH, SERVICE_NAME
          script: |
              set -e

              echo "Deploying branch: $BRANCH to $APP_DIR (service: $SERVICE_NAME)"

              cd $APP_DIR
              git fetch origin
              git checkout $BRANCH
              git pull origin $BRANCH

              # Cleanup
              echo "Cleaning temp folder..."
              rm -rf "$APP_DIR/temp/*"

              echo "Removing old SQLite database files..."
              find . -type f -name 'akilimo_compute*.sqlite*' -exec rm -f {} \;

              echo "Installing R packages..."
              sudo Rscript install_packages.R

              # Reload services
              sudo systemctl daemon-reload
              sudo systemctl restart $SERVICE_NAME

              sudo nginx -t
              sudo systemctl restart nginx

              echo "Deployment completed successfully"
