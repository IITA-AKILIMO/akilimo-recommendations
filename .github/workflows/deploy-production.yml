name: SSH service deployment

# Production: branch, folder and service come from .github/deploy-targets.json;
# the pipeline itself is in deploy.yml (shared with beta).
on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/**'
      - 'R/**'
      - 'api.R'
      - 'refresh_prices.R'
      - 'install_packages.R'
      - 'net/**'
      - 'systemd/**'
      - 'tests/**'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      setup_data:
        description: "Pull runtime data (OSF/Zenodo) before deploying"
        type: boolean
        default: false
      data_source:
        description: "Data source (used when setup_data is ticked)"
        type: choice
        default: "osf"
        options:
          - osf
          - zenodo

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      target: production
      setup_data: ${{ inputs.setup_data == true }}
      data_source: ${{ inputs.data_source || 'osf' }}
    secrets: inherit
