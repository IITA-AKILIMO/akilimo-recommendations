name: Build and deploy

# One pipeline for every branch, with one job per stage:
#
#   Plan -> Wait for more pushes -> R checks -> Update code and packages
#        -> Pull runtime data (optional) -> Restart service -> Check health
#        -> Tag release (production only)
#
# "R checks" sets up R once and runs every R check as its own step. Its R
# packages are cached under a key made from install_packages.R: while that
# file is unchanged they come from the cache and nothing is installed.
#
# Pull requests and feature branches stop after the checks. Pushes to a branch
# listed in .github/deploy-targets.json (main -> production, experimental ->
# beta) deploy, but only after every check has passed.
on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'old/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'old/**'
  workflow_dispatch:
    inputs:
      setup_data:
        description: "Pull runtime data (OSF/Zenodo) before deploying"
        type: boolean
        default: false
      data_source:
        description: "Data source (used when setup_data is ticked)"
        type: choice
        default: "osf"
        options:
          - osf
          - zenodo

permissions:
  contents: read

# Feature branches and PRs: a newer push cancels the older run.
# Deploy branches handle this per job below, so a deploy is never cut short.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/experimental' }}

env:
  QUIET_PERIOD: "60" # seconds to wait after the last commit before deploying

jobs:
  # ---------------------------------------------------------------------------
  # Work out whether this run deploys, and where to
  # ---------------------------------------------------------------------------
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    outputs:
      deploy: ${{ steps.pick.outputs.deploy }}
      target: ${{ steps.pick.outputs.target }}
      app_dir: ${{ steps.target.outputs.app_dir }}
      service_name: ${{ steps.target.outputs.service_name }}
    steps:
      - name: Check out deploy settings
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github

      - name: Match branch to a deploy target
        id: pick
        env:
          BRANCH: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          target=$(jq -r --arg b "$BRANCH" \
            'to_entries[] | select(.value.branch == $b) | .key' \
            .github/deploy-targets.json | head -n1)

          deploy=false
          if [ -n "$target" ] && { [ "$EVENT" = "push" ] || [ "$EVENT" = "workflow_dispatch" ]; }; then
            deploy=true
          fi

          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

          if [ "$deploy" = "true" ]; then
            echo "### Deploying \`$BRANCH\` to **$target** after the checks pass" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Checks only, no deploy for \`$BRANCH\` ($EVENT)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Look up folder and service
        id: target
        if: steps.pick.outputs.deploy == 'true'
        uses: ./.github/actions/resolve-target
        with:
          target: ${{ steps.pick.outputs.target }}
          # Production-only overrides, kept from the previous workflow
          app_dir_override: ${{ steps.pick.outputs.target == 'production' && vars.APP_DIR_OVERRIDE || '' }}
          service_override: ${{ steps.pick.outputs.target == 'production' && vars.SERVICE_NAME_OVERRIDE || '' }}

  # ---------------------------------------------------------------------------
  # Debounce: a newer push to the same deploy branch cancels this wait, and
  # with it everything after it in this run
  # ---------------------------------------------------------------------------
  wait:
    name: Wait for more pushes
    needs: [ plan ]
    if: needs.plan.outputs.deploy == 'true' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    concurrency:
      group: deploy-${{ needs.plan.outputs.target }}-wait
      cancel-in-progress: true
    steps:
      - name: Wait until 60s after the last commit
        env:
          COMMIT_TIME: ${{ github.event.head_commit.timestamp }}
        run: |
          elapsed=$(( $(date +%s) - $(date -d "$COMMIT_TIME" +%s) ))
          wait_time=$((QUIET_PERIOD - elapsed))

          if [ $wait_time -gt 0 ]; then
            echo "Last commit was ${elapsed}s ago, waiting ${wait_time}s..."
            sleep $wait_time
          else
            echo "Last commit was ${elapsed}s ago, no wait needed."
          fi

  # ---------------------------------------------------------------------------
  # Checks: one job, R set up once; every check must pass before anything
  # deploys. Each check still runs (and reports) if an earlier one failed.
  # ---------------------------------------------------------------------------
  checks:
    name: R checks
    needs: [ plan, wait ]
    if: >-
      !cancelled() &&
      (needs.wait.result == 'success' || needs.wait.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AKILIMO_ROOT: ${{ github.workspace }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up R and packages (cached)
        id: r
        uses: ./.github/actions/setup-r-env

      - name: Check R syntax
        run: Rscript tests/check_parse.R

      - name: Test price database
        if: ${{ !cancelled() && steps.r.outcome == 'success' }}
        run: |
          Rscript -e '
            r <- tinytest::run_test_file("tests/test_akilimo_db.R", verbose = 1)
            print(summary(r))
            quit(status = if (all(as.logical(r))) 0 else 1)
          '

      - name: Test request validation
        if: ${{ !cancelled() && steps.r.outcome == 'success' }}
        run: |
          Rscript -e '
            r <- tinytest::run_test_file("tests/test_validate_request.R", verbose = 1)
            print(summary(r))
            quit(status = if (all(as.logical(r))) 0 else 1)
          '

      - name: Test PDF templates
        if: ${{ !cancelled() && steps.r.outcome == 'success' }}
        run: |
          Rscript -e '
            r <- tinytest::run_test_file("tests/test_pdf_template.R", verbose = 1)
            print(summary(r))
            quit(status = if (all(as.logical(r))) 0 else 1)
          '

      - name: Test intercrop field-size scaling
        if: ${{ !cancelled() && steps.r.outcome == 'success' }}
        run: |
          Rscript -e '
            r <- tinytest::run_test_file("tests/test_ic_units.R", verbose = 1)
            print(summary(r))
            quit(status = if (all(as.logical(r))) 0 else 1)
          '

      # --- Recommendation tests: need the runtime data (about 560 MB, public on
      # OSF). It is cached under a key made from scripts/.env.example (which holds
      # the OSF/Zenodo IDs), so it is downloaded only when the data release changes.
      # translations.csv and fertilizer_npk.csv are tracked in git, so the cache never includes them.
      - name: Restore cached runtime data
        id: data
        if: ${{ !cancelled() && steps.r.outcome == 'success' }}
        uses: actions/cache/restore@v6
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "5"
        with:
          path: |
            data/yield
            data/soil
            data/input
            !data/input/translations.csv
            !data/input/fertilizer_npk.csv
          key: runtime-data-v1-${{ hashFiles('scripts/.env.example') }}

      - name: Install Python for the data download (cache miss)
        if: ${{ !cancelled() && steps.r.outcome == 'success' && steps.data.outputs.cache-hit != 'true' }}
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Download runtime data from OSF (cache miss)
        if: ${{ !cancelled() && steps.r.outcome == 'success' && steps.data.outputs.cache-hit != 'true' }}
        working-directory: scripts
        run: |
          cp .env.example .env
          pipx install poetry
          poetry install --no-interaction
          poetry run setup-data --source osf

      - name: Save runtime data to the cache
        if: ${{ !cancelled() && steps.r.outcome == 'success' && steps.data.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            data/yield
            data/soil
            data/input
            !data/input/translations.csv
            !data/input/fertilizer_npk.csv
          key: runtime-data-v1-${{ hashFiles('scripts/.env.example') }}

      - name: Test recommendations against the saved baseline
        if: ${{ !cancelled() && steps.r.outcome == 'success' }}
        run: |
          # The test skips itself without data; in CI missing data is a failure
          test -f data/yield/Nigeria_WLY_LINTUL_2020.RDS || { echo "::error::runtime data missing"; exit 1; }
          Rscript -e '
            r <- tinytest::run_test_file("tests/test_small.R", verbose = 1)
            print(summary(r))
            # Show each failing check (fixture, call and difference), not just the count
            if (!all(as.logical(r))) print(r[!as.logical(r)])
            quit(status = if (length(r) > 0 && all(as.logical(r))) 0 else 1)
          '

      - name: Test Rwanda regressions
        if: ${{ !cancelled() && steps.r.outcome == 'success' }}
        run: |
          Rscript -e '
            r <- tinytest::run_test_file("tests/test_rw_regressions.R", verbose = 1)
            print(summary(r))
            if (!all(as.logical(r))) print(r[!as.logical(r)])
            quit(status = if (length(r) > 0 && all(as.logical(r))) 0 else 1)
          '

  # ---------------------------------------------------------------------------
  # Deploy: one job per server step, strictly in order. Server jobs share a
  # per-target lock so two runs never work on the same server at once.
  # ---------------------------------------------------------------------------
  update:
    name: Update code and packages (${{ needs.plan.outputs.target }})
    needs: [ plan, checks ]
    if: >-
      !cancelled() &&
      needs.plan.outputs.deploy == 'true' &&
      needs.checks.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:
      group: server-${{ needs.plan.outputs.target }}
      cancel-in-progress: false
    steps:
      - name: Pull code, clear temp files and install R packages
        uses: appleboy/ssh-action@v1.2.5
        env:
          APP_DIR: ${{ needs.plan.outputs.app_dir }}
          BRANCH: ${{ github.ref_name }}
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          envs: APP_DIR, BRANCH
          script: |
            set -e
            cd "$APP_DIR"

            echo "Updating $APP_DIR to $BRANCH..."
            # These files used to come only from the data bundle (or were copied by
            # hand); they are now tracked in git, so an untracked copy would block the pull
            for f in data/input/translations.csv data/input/fertilizer_npk.csv; do
              if [ -f "$f" ] && ! git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
                echo "Replacing the untracked $f with the tracked one"
                rm -f "$f"
              fi
            done
            git fetch origin
            git checkout "$BRANCH"
            git pull origin "$BRANCH"

            echo "Cleaning temp folder..."
            rm -rf "$APP_DIR"/temp/*

            # The price database is kept: on start the API migrates it and
            # updates it from the seed CSVs without losing refreshed prices

            # Exits non-zero if any package fails, which stops the deploy here
            echo "Installing R packages..."
            sudo Rscript install_packages.R

  # Optional, manual runs only. Runs after the code update so it uses the
  # latest scripts/, and before the restart so the API loads the new data.
  setup-data:
    name: Pull runtime data (${{ needs.plan.outputs.target }})
    needs: [ plan, update ]
    if: >-
      !cancelled() &&
      needs.update.result == 'success' &&
      github.event_name == 'workflow_dispatch' && inputs.setup_data
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: server-${{ needs.plan.outputs.target }}
      cancel-in-progress: false
    steps:
      - name: Check out actions
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github

      - name: Download data on the server
        uses: ./.github/actions/pull-data
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          app_dir: ${{ needs.plan.outputs.app_dir }}
          source: ${{ inputs.data_source }}
          zenodo_record_id: ${{ secrets.ZENODO_RECORD_ID }}
          osf_node_id: ${{ secrets.OSF_NODE_ID }}

  restart:
    name: Restart service (${{ needs.plan.outputs.target }})
    needs: [ plan, update, setup-data ]
    # Data pull is optional: restart when it passed or was not requested
    if: >-
      !cancelled() &&
      needs.update.result == 'success' &&
      (needs.setup-data.result == 'success' || needs.setup-data.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: server-${{ needs.plan.outputs.target }}
      cancel-in-progress: false
    steps:
      - name: Reload systemd and restart the API
        uses: appleboy/ssh-action@v1.2.5
        env:
          SERVICE_NAME: ${{ needs.plan.outputs.service_name }}
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: SERVICE_NAME
          script: |
            set -e
            sudo systemctl daemon-reload
            sudo systemctl restart "$SERVICE_NAME"
            echo "Restarted $SERVICE_NAME"

  health:
    name: Check health (${{ needs.plan.outputs.target }})
    needs: [ plan, restart ]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Wait for GET /health (up to 180s)
        uses: appleboy/ssh-action@v1.2.5
        env:
          APP_DIR: ${{ needs.plan.outputs.app_dir }}
          SERVICE_NAME: ${{ needs.plan.outputs.service_name }}
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 5m
          envs: APP_DIR, SERVICE_NAME
          script: |
            cd "$APP_DIR"

            # The API takes a while to load its data
            PORT=$(grep -E '^API_PORT=' .env 2>/dev/null | tail -n1 | cut -d= -f2 | tr -d '"'"'"' \r')
            PORT=${PORT:-8000}
            echo "Waiting for http://127.0.0.1:$PORT/health ..."
            for i in $(seq 1 36); do
              if curl -fsS "http://127.0.0.1:$PORT/health" >/dev/null 2>&1; then
                echo "Service healthy after ~$((i * 5))s"
                exit 0
              fi
              sleep 5
            done

            echo "ERROR: $SERVICE_NAME did not become healthy within 180s"
            sudo systemctl status "$SERVICE_NAME" --no-pager || true
            sudo journalctl -u "$SERVICE_NAME" -n 50 --no-pager || true
            exit 1

  # ---------------------------------------------------------------------------
  # Release: production only, and only once the deploy is healthy
  # ---------------------------------------------------------------------------
  tag:
    name: Tag release
    needs: [ plan, health ]
    if: needs.plan.outputs.target == 'production'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: tag-release
      cancel-in-progress: false
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # lets the tag action fall back to local git history

      # v7 runs on Node 24 (the old masgeek fork pinned to @release was a
      # Node 16 build of upstream 6.1). Commits without a recognised type,
      # like the gitmoji-prefixed ones here, still get the default patch bump.
      - name: Work out the next version tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          tag_prefix: ""
          create_annotated_tag: true

      - name: Publish the GitHub release
        if: steps.tag_version.outputs.new_tag != ''
        uses: ncipollo/release-action@v1.21.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: Version ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
          makeLatest: true
          allowUpdates: true
          generateReleaseNotes: true
          skipIfReleaseExists: false
