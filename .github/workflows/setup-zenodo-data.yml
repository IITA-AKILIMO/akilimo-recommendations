name: Data setup

# Pulls runtime data (OSF or Zenodo) onto a deploy target's server.
# Run it manually, or from deploy.yml with setup_data: true.
# Target paths come from .github/deploy-targets.json.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - beta
      source:
        description: "Download source"
        required: true
        default: "osf"
        type: choice
        options:
          - zenodo
          - osf
      record_id:
        description: "Zenodo record ID (overrides secret; Zenodo only)"
        required: false
      osf_node_id:
        description: "OSF project node ID (overrides secret; OSF only)"
        required: false
  workflow_call:
    inputs:
      target:
        type: string
        required: true
      source:
        type: string
        required: false
        default: "osf"
      record_id:
        type: string
        required: false
        default: ""
      osf_node_id:
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  setup-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Never run two data pulls against the same server folder at once
    concurrency:
      group: setup-data-${{ inputs.target }}
      cancel-in-progress: false

    steps:
      - name: Checkout deploy config
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Resolve target
        id: target
        uses: ./.github/actions/resolve-target
        with:
          target: ${{ inputs.target }}
          app_dir_override: ${{ inputs.target == 'production' && vars.APP_DIR_OVERRIDE || '' }}

      - name: Pull runtime data via SSH
        uses: appleboy/ssh-action@v1.2.4
        env:
          APP_DIR: ${{ steps.target.outputs.app_dir }}
          DATA_SOURCE: ${{ inputs.source }}
          ZENODO_RECORD_ID: ${{ inputs.record_id || secrets.ZENODO_RECORD_ID }}
          OSF_NODE_ID: ${{ inputs.osf_node_id || secrets.OSF_NODE_ID }}
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 40m
          envs: APP_DIR, DATA_SOURCE, ZENODO_RECORD_ID, OSF_NODE_ID
          script: |
            set -e

            cd "$APP_DIR/scripts"

            if [ ! -f ".env" ]; then
              cp .env.example .env
            fi

            if [ -n "$ZENODO_RECORD_ID" ]; then
              sed -i "s/^ZENODO_RECORD_ID=.*/ZENODO_RECORD_ID=$ZENODO_RECORD_ID/" .env
            fi
            if [ -n "$OSF_NODE_ID" ]; then
              sed -i "s/^OSF_NODE_ID=.*/OSF_NODE_ID=$OSF_NODE_ID/" .env
            fi

            poetry run setup-data --source "$DATA_SOURCE"
            echo "Data setup complete (source: $DATA_SOURCE, dir: $APP_DIR)"
