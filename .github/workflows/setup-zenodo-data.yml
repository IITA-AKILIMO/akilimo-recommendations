name: Data setup

# Pulls runtime data (OSF or Zenodo) onto a deploy target's server, on its own.
# To pull data as part of a deploy, run "Build and deploy" by hand with
# setup_data ticked. Target paths come from .github/deploy-targets.json.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - beta
      source:
        description: "Download source"
        required: true
        default: "osf"
        type: choice
        options:
          - zenodo
          - osf
      record_id:
        description: "Zenodo record ID (overrides secret; Zenodo only)"
        required: false
      osf_node_id:
        description: "OSF project node ID (overrides secret; OSF only)"
        required: false

permissions:
  contents: read

jobs:
  setup-data:
    name: Pull runtime data (${{ inputs.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Shares the pipeline's server lock, so it never runs during a deploy
    concurrency:
      group: server-${{ inputs.target }}
      cancel-in-progress: false

    steps:
      - name: Check out deploy settings
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Look up folder
        id: target
        uses: ./.github/actions/resolve-target
        with:
          target: ${{ inputs.target }}
          app_dir_override: ${{ inputs.target == 'production' && vars.APP_DIR_OVERRIDE || '' }}

      - name: Download data on the server
        uses: ./.github/actions/pull-data
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          app_dir: ${{ steps.target.outputs.app_dir }}
          source: ${{ inputs.source }}
          zenodo_record_id: ${{ inputs.record_id || secrets.ZENODO_RECORD_ID }}
          osf_node_id: ${{ inputs.osf_node_id || secrets.OSF_NODE_ID }}
