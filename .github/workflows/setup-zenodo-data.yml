name: Data setup

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Download source"
        required: true
        default: "zenodo"
        type: choice
        options:
          - zenodo
          - osf
      record_id:
        description: "Zenodo record ID (overrides secret; Zenodo only)"
        required: false
      osf_node_id:
        description: "OSF project node ID (overrides secret; OSF only)"
        required: false

permissions:
  contents: read

env:
  APP_DIR: "/home/akilimo/projects/new_akilimo"

jobs:
  setup-data:
    runs-on: ubuntu-latest

    steps:
      - name: Pull runtime data via SSH
        uses: appleboy/ssh-action@v1.2.4
        env:
          APP_DIR: ${{ secrets.APP_DIR_OVERRIDE || env.APP_DIR }}
          DATA_SOURCE: ${{ inputs.source }}
          ZENODO_RECORD_ID: ${{ inputs.record_id || secrets.ZENODO_RECORD_ID }}
          OSF_NODE_ID: ${{ inputs.osf_node_id || secrets.OSF_NODE_ID }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: APP_DIR, DATA_SOURCE, ZENODO_RECORD_ID, OSF_NODE_ID
          script: |
            set -e

            cd $APP_DIR/scripts

            if [ ! -f ".env" ]; then
              cp .env.example .env
            fi

            if [ -n "$ZENODO_RECORD_ID" ]; then
              sed -i "s/^ZENODO_RECORD_ID=.*/ZENODO_RECORD_ID=$ZENODO_RECORD_ID/" .env
            fi
            if [ -n "$OSF_NODE_ID" ]; then
              sed -i "s/^OSF_NODE_ID=.*/OSF_NODE_ID=$OSF_NODE_ID/" .env
            fi

            poetry run setup-data --source "$DATA_SOURCE"
            echo "Data setup complete (source: $DATA_SOURCE)"
