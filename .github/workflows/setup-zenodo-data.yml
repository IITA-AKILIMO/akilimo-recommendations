name: Zenodo data setup

on:
  workflow_dispatch:
    inputs:
      record_id:
        description: "Zenodo record ID (overrides secret)"
        required: false

permissions:
  contents: read

env:
  APP_DIR: "/home/akilimo/projects/new_akilimo"

jobs:
  setup-data:
    runs-on: ubuntu-latest

    steps:
      - name: Pull runtime data from Zenodo via SSH
        uses: appleboy/ssh-action@v1.2.4
        env:
          APP_DIR: ${{ secrets.APP_DIR_OVERRIDE || env.APP_DIR }}
          ZENODO_RECORD_ID: ${{ inputs.record_id || secrets.ZENODO_RECORD_ID }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: APP_DIR, ZENODO_RECORD_ID
          script: |
            set -e

            cd $APP_DIR/scripts

            if [ -f ".env" ]; then
              if [ -n "$ZENODO_RECORD_ID" ]; then
                export ZENODO_RECORD_ID="$ZENODO_RECORD_ID"
              fi
            else
              cp .env.example .env
              if [ -n "$ZENODO_RECORD_ID" ]; then
                sed -i "s/^ZENODO_RECORD_ID=.*/ZENODO_RECORD_ID=$ZENODO_RECORD_ID/" .env
              fi
            fi

            poetry run setup-data
            echo "Zenodo data setup complete"
