name: CI

# Every push and pull request:
#
#   Wait for more pushes -> Build CI image -> R checks -> Deploy (pushes only;
#   see deploy.yml)
#
# "Wait for more pushes" comes first, so a burst of pushes to a deploy branch
# (main, experimental) runs the checks and the deploy once, for the last push:
# a newer push cancels the older run's wait, and with it the checks and deploy
# after it. Other branches and pull requests don't wait.
#
# "Build CI image" builds Dockerfile.ci (R, system libraries and R packages) and
# pushes it to GHCR, tagged with Git's ID of install_packages.R; it builds only
# when no image with that tag exists. "R checks" runs inside that
# image and runs every R check as its own step, with nothing left to install.
#
# Deploy is a separate, reusable workflow (deploy.yml) called once every check
# has passed. It decides from .github/deploy-targets.json whether the branch
# deploys (main -> production, experimental -> beta); on any other branch it
# only runs its small Plan job. GitHub shows it as one collapsible box.
on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'old/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'old/**'

permissions:
  contents: read

# Feature branches and PRs: a newer push cancels the older run.
# Deploy branches: every run gets its own group, so a run is never cut short
# (a deploy always finishes) and a new run is not queued behind the old one.
# Queuing would keep a new run from ever reaching its wait job, which is what
# cancels the superseded runs. Deploys still take turns through the per-server
# lock in deploy.yml.
concurrency:
  group: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/experimental') && format('ci-{0}', github.run_id) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/experimental' }}

env:
  QUIET_PERIOD: "60" # seconds to wait after the last commit before checking and deploying

jobs:
  # ---------------------------------------------------------------------------
  # Debounce, before any real work: a newer push to the same branch cancels
  # this job, and with it the checks and the deploy of this older run. Only
  # branches with a deploy target (see deploy-targets.json) actually wait.
  # ---------------------------------------------------------------------------
  debounce:
    name: Wait for more pushes
    if: github.event_name == 'push'
    # Only reads the deploy targets file
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: debounce-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out deploy settings
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github

      - name: Wait until 60s after the last commit
        env:
          BRANCH: ${{ github.ref_name }}
          COMMIT_TIME: ${{ github.event.head_commit.timestamp }}
        run: |
          target=$(jq -r --arg b "$BRANCH" \
            'to_entries[] | select(.value.branch == $b) | .key' \
            .github/deploy-targets.json | head -n1)

          if [ -z "$target" ]; then
            echo "$BRANCH has no deploy target, no wait needed."
            exit 0
          fi

          elapsed=$(( $(date +%s) - $(date -d "$COMMIT_TIME" +%s) ))
          wait_time=$((QUIET_PERIOD - elapsed))

          if [ $wait_time -gt 0 ]; then
            echo "Last commit was ${elapsed}s ago, waiting ${wait_time}s..."
            sleep $wait_time
          else
            echo "Last commit was ${elapsed}s ago, no wait needed."
          fi

  # ---------------------------------------------------------------------------
  # Gate: a push to a branch that has an open pull request is checked by the pull request's own run, on the same commit, so
  # the push run is skipped and the R checks do not run twice. A branch with a deploy target (deploy-targets.json) is NEVER
  # skipped: its push run is the one that deploys, even while a pull request (for example experimental into main) is open.
  # If the lookups fail, the run goes ahead.
  # ---------------------------------------------------------------------------
  gate:
    name: Decide whether to run
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Check out deploy settings
        if: github.event_name == 'push'
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github

      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          run=true

          if [ "$EVENT" = "push" ]; then
            # No pipe here: a failing jq must be seen, and must never lead to a skip
            if ! target="$(jq -r --arg b "$BRANCH" 'to_entries[] | select(.value.branch == $b) | .key' .github/deploy-targets.json)"; then
              target="unknown"
            fi
            target="${target%%$'\n'*}"   # the first match only

            if [ -n "$target" ]; then
              echo "$BRANCH deploys to $target, so this push run always runs." >> "$GITHUB_STEP_SUMMARY"
            else
              # An open pull request runs the same checks on this commit, so the push run would only duplicate them
              open="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq 'length' 2>/dev/null || echo 0)"
              if [ "${open:-0}" != "0" ]; then
                run=false
                echo "A pull request is open for $BRANCH, so its own run checks this commit. This push run is skipped." >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          fi

          echo "run=$run" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # CI image: R, system libraries and R packages (Dockerfile.ci), tagged with
  # Git's ID (sha) of install_packages.R.
  # Built and pushed to GHCR only when no image with that tag exists yet, so
  # most runs finish in seconds.
  # ---------------------------------------------------------------------------
  image:
    name: Build CI image
    needs: [ debounce, gate ]
    if: >-
      !cancelled() &&
      needs.gate.result == 'success' &&
      needs.gate.outputs.run == 'true' &&
      (needs.debounce.result == 'success' || needs.debounce.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.tag.outputs.ref }}
    steps:
      - name: Check out the image inputs
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            Dockerfile.ci
            install_packages.R
            requirements.txt
          sparse-checkout-cone-mode: false

      - name: Work out the image tag
        id: tag
        run: |
          # The tag is Git's own ID of the committed install_packages.R, the full
          # 40 characters: the same on every machine (no line-ending differences),
          # and you can get it locally with
          #   git rev-parse HEAD:install_packages.R
          # Only that file decides when to rebuild.
          sha=$(git rev-parse HEAD:install_packages.R)
          ref="ghcr.io/${GITHUB_REPOSITORY,,}-ci:$sha"   # registry names are lowercase
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Image: $ref" >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Check whether the image already exists
        id: exists
        run: |
          if docker manifest inspect "${{ steps.tag.outputs.ref }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Image exists, nothing to build." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push the image
        if: steps.exists.outputs.found != 'true'
        run: |
          docker build -f Dockerfile.ci -t "${{ steps.tag.outputs.ref }}" .
          docker push "${{ steps.tag.outputs.ref }}"
          echo "Built and pushed the image." >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Checks: one job, run inside the CI image; every check must pass before
  # anything deploys. Each check still runs (and reports) if an earlier one
  # failed.
  # ---------------------------------------------------------------------------
  checks:
    name: R checks
    needs: [ image ]
    # Skipped when the wait was cancelled by a newer push, or the image failed
    if: >-
      !cancelled() &&
      needs.image.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The workflow default is contents: read only, which leaves the token
    # without access to GHCR packages, so pulling the image below is "denied"
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      # --- Skip work that already passed. The key is a hash of everything these checks depend on
      # (R code, tests and their baseline, tools, the tracked data files, the image inputs, the
      # data release in scripts/.env.example, and this workflow). If an identical tree passed
      # before (a re-run, a push that only touched scripts/ or the docs), every step below is
      # skipped, including the 560 MB data restore, and the job still reports success. Any
      # change to those files gives a new key and runs everything. GitHub keeps a cache entry
      # for 7 days without use; a branch reads its own entries and its base branch's.
      - name: Look for an earlier pass of this exact code
        id: passed
        uses: actions/cache/restore@v6
        with:
          path: .ci-passed
          key: r-checks-passed-v1-${{ hashFiles('R/**', 'tests/**', 'tools/**', 'systemd/**', 'api.R', '.lintr', 'install_packages.R', 'requirements.txt', 'Dockerfile.ci', 'scripts/.env.example', 'data/input/translations.csv', 'data/input/fertilizer_npk.csv', 'data/input/cassava_area_spam2020.csv', '.github/workflows/ci.yml') }}

      - name: Say what happens
        run: |
          if [ "${{ steps.passed.outputs.cache-hit }}" = "true" ]; then
            echo "These checks already passed for identical code, so they are skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No earlier pass for this code: running every check." >> "$GITHUB_STEP_SUMMARY"
          fi

      # github.workspace is the host path inside a container job; the runtime
      # variable is the path the steps actually see
      - name: Point AKILIMO_ROOT at the checkout
        if: ${{ !cancelled() && steps.passed.outputs.cache-hit != 'true' }}
        run: echo "AKILIMO_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      # --- Runtime data, ready before any R script runs: the recommendation tests
      # need it (about 560 MB, public on OSF), and the price database test seeds
      # from its CSVs. It is cached under a key made from scripts/.env.example
      # (which holds the OSF node ID), so it is downloaded only when the data
      # release changes; on a cache miss the three steps below fetch it from OSF
      # and save it.
      # translations.csv and fertilizer_npk.csv are tracked in git, so the cache never includes them.
      - name: Restore cached runtime data
        id: data
        if: ${{ (!cancelled()) && steps.passed.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@v6
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "5"
        with:
          path: |
            data/yield
            data/soil
            data/input
            !data/input/translations.csv
            !data/input/fertilizer_npk.csv
          key: runtime-data-v2-${{ hashFiles('scripts/.env.example') }}

      - name: Install Python for the data download (cache miss)
        if: ${{ (!cancelled() && steps.data.outputs.cache-hit != 'true') && steps.passed.outputs.cache-hit != 'true' }}
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Download runtime data from OSF (cache miss)
        id: download
        if: ${{ (!cancelled() && steps.data.outputs.cache-hit != 'true') && steps.passed.outputs.cache-hit != 'true' }}
        working-directory: scripts
        env:
          # OSF answers 401 to a file listing without one; empty (and harmless) on fork PRs
          OSF_TOKEN: ${{ secrets.OSF_TOKEN }}
          # Where the data comes from: github (the private data repository named in
          # scripts/assets.json) unless the DATA_SOURCE repository variable says osf or zenodo.
          # The release is read with the DATA_GITHUB_TOKEN secret (Contents: read on that
          # repository) and nothing else: the job's own github.token is deliberately not used
          DATA_SOURCE: ${{ vars.DATA_SOURCE }}
          # Overrides of the data repository (owner/name) and release tag in scripts/assets.json
          GITHUB_DATA_REPO: ${{ vars.DATA_REPO }}
          GITHUB_DATA_TAG: ${{ vars.DATA_TAG }}
          GITHUB_TOKEN: ${{ secrets.DATA_GITHUB_TOKEN }}
        run: |
          cp .env.example .env
          pipx install poetry
          # pipx puts poetry here, which is not on the PATH of this step
          export PATH="$PATH:$HOME/.local/bin"
          poetry install --no-interaction
          # CI needs no DSSAT output (the PDC tests use a made-up table). If the default source
          # fails (the release is not published yet, the token is missing, GitHub is down), fall
          # back to OSF, which still holds the data, and say so in a warning
          poetry run setup-data ${DATA_SOURCE:+--source "$DATA_SOURCE"} --exclude dssat || {
            echo "::warning::Data download from the default source failed; falling back to OSF"
            poetry run setup-data --source osf --exclude dssat
          }

      # Only after a download that worked: saving after a failed one stored an empty
      # cache under this key, and every later run restored it and found no data
      - name: Save runtime data to the cache
        if: ${{ (!cancelled() && steps.data.outputs.cache-hit != 'true' && steps.download.outcome == 'success') && steps.passed.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            data/yield
            data/soil
            data/input
            !data/input/translations.csv
            !data/input/fertilizer_npk.csv
          key: runtime-data-v2-${{ hashFiles('scripts/.env.example') }}

      # Not in the OSF bundle: derived from the RW yield data that is. Built every
      # run, never cached, and skipped when the bundle already has the file.
      - name: Build the Rwanda scheduled-planting file
        if: ${{ (!cancelled()) && steps.passed.outputs.cache-hit != 'true' }}
        run: sh tools/ensure_sp_files.sh

      - name: Check R syntax
        if: ${{ !cancelled() && steps.passed.outputs.cache-hit != 'true' }}
        run: Rscript tests/check_parse.R

      - name: Lint R code
        if: ${{ (!cancelled()) && steps.passed.outputs.cache-hit != 'true' }}
        run: Rscript tests/check_lint.R

      - name: Test price database
        if: ${{ (!cancelled()) && steps.passed.outputs.cache-hit != 'true' }}
        run: Rscript tests/run_ci_test.R tests/test_akilimo_db.R

      - name: Test request validation
        if: ${{ (!cancelled()) && steps.passed.outputs.cache-hit != 'true' }}
        run: Rscript tests/run_ci_test.R tests/test_validate_request.R

      - name: Test logging
        if: ${{ (!cancelled()) && steps.passed.outputs.cache-hit != 'true' }}
        run: Rscript tests/run_ci_test.R tests/test_logging.R

      - name: Test PDF templates
        if: ${{ (!cancelled()) && steps.passed.outputs.cache-hit != 'true' }}
        run: Rscript tests/run_ci_test.R tests/test_pdf_template.R

      - name: Test intercrop field-size scaling
        if: ${{ (!cancelled()) && steps.passed.outputs.cache-hit != 'true' }}
        run: Rscript tests/run_ci_test.R tests/test_ic_units.R

      - name: Test the cassava-area mask
        if: ${{ (!cancelled()) && steps.passed.outputs.cache-hit != 'true' }}
        run: Rscript tests/run_ci_test.R tests/test_cassava_mask.R

      - name: Test planting date and cultivar advice
        if: ${{ (!cancelled()) && steps.passed.outputs.cache-hit != 'true' }}
        run: Rscript tests/run_ci_test.R tests/test_pdc_units.R

      - name: Test recommendations against the saved baseline
        if: ${{ (!cancelled()) && steps.passed.outputs.cache-hit != 'true' }}
        run: |
          # The test skips itself without data; in CI missing data is a failure
          test -f data/yield/Nigeria_WLY_LINTUL_2020.RDS || { echo "::error::runtime data missing"; exit 1; }
          Rscript tests/run_ci_test.R tests/test_small.R

      - name: Test Rwanda regressions
        if: ${{ (!cancelled()) && steps.passed.outputs.cache-hit != 'true' }}
        run: Rscript tests/run_ci_test.R tests/test_rw_regressions.R

      # The deploy's health check finds the service's own port; this tests how, with fake systemctl and ss
      - name: Test the deploy health check script
        if: ${{ (!cancelled()) && steps.passed.outputs.cache-hit != 'true' }}
        run: sh tests/test_check_health.sh

      - name: Test the deploy housekeeping script
        if: ${{ (!cancelled()) && steps.passed.outputs.cache-hit != 'true' }}
        run: sh tests/test_housekeeping.sh

      # success() is true only when every step above passed, so a marker is never saved for a
      # failing run
      - name: Remember that these checks passed
        if: ${{ success() && steps.passed.outputs.cache-hit != 'true' }}
        run: echo ok > .ci-passed

      - name: Save the pass marker
        if: ${{ success() && steps.passed.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: .ci-passed
          key: r-checks-passed-v1-${{ hashFiles('R/**', 'tests/**', 'tools/**', 'systemd/**', 'api.R', '.lintr', 'install_packages.R', 'requirements.txt', 'Dockerfile.ci', 'scripts/.env.example', 'data/input/translations.csv', 'data/input/fertilizer_npk.csv', 'data/input/cassava_area_spam2020.csv', '.github/workflows/ci.yml') }}

  # ---------------------------------------------------------------------------
  # Deploy: a separate workflow (deploy.yml), run only for pushes once every
  # check has passed. On branches without a deploy target it stops after Plan.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: [ checks ]
    if: github.event_name == 'push'
    # The release tag (production) needs to write to the repository
    permissions:
      contents: write
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
