name: CI

# Every push and pull request:
#
#   Wait for more pushes -> Build CI image -> R checks -> Deploy (pushes only;
#   see deploy.yml)
#
# "Wait for more pushes" comes first, so a burst of pushes to a deploy branch
# (main, experimental) runs the checks and the deploy once, for the last push:
# a newer push cancels the older run's wait, and with it the checks and deploy
# after it. Other branches and pull requests don't wait.
#
# "Build CI image" builds Dockerfile.ci (R, system libraries and R packages) and
# pushes it to GHCR, tagged with a hash of Dockerfile.ci and install_packages.R;
# it builds only when no image with that tag exists. "R checks" runs inside that
# image and runs every R check as its own step, with nothing left to install.
#
# Deploy is a separate, reusable workflow (deploy.yml) called once every check
# has passed. It decides from .github/deploy-targets.json whether the branch
# deploys (main -> production, experimental -> beta); on any other branch it
# only runs its small Plan job. GitHub shows it as one collapsible box.
on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'old/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'old/**'

permissions:
  contents: read

# Feature branches and PRs: a newer push cancels the older run.
# Deploy branches: every run gets its own group, so a run is never cut short
# (a deploy always finishes) and a new run is not queued behind the old one.
# Queuing would keep a new run from ever reaching its wait job, which is what
# cancels the superseded runs. Deploys still take turns through the per-server
# lock in deploy.yml.
concurrency:
  group: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/experimental') && format('ci-{0}', github.run_id) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/experimental' }}

env:
  QUIET_PERIOD: "60" # seconds to wait after the last commit before checking and deploying

jobs:
  # ---------------------------------------------------------------------------
  # Debounce, before any real work: a newer push to the same branch cancels
  # this job, and with it the checks and the deploy of this older run. Only
  # branches with a deploy target (see deploy-targets.json) actually wait.
  # ---------------------------------------------------------------------------
  debounce:
    name: Wait for more pushes
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: debounce-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out deploy settings
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github

      - name: Wait until 60s after the last commit
        env:
          BRANCH: ${{ github.ref_name }}
          COMMIT_TIME: ${{ github.event.head_commit.timestamp }}
        run: |
          target=$(jq -r --arg b "$BRANCH" \
            'to_entries[] | select(.value.branch == $b) | .key' \
            .github/deploy-targets.json | head -n1)

          if [ -z "$target" ]; then
            echo "$BRANCH has no deploy target, no wait needed."
            exit 0
          fi

          elapsed=$(( $(date +%s) - $(date -d "$COMMIT_TIME" +%s) ))
          wait_time=$((QUIET_PERIOD - elapsed))

          if [ $wait_time -gt 0 ]; then
            echo "Last commit was ${elapsed}s ago, waiting ${wait_time}s..."
            sleep $wait_time
          else
            echo "Last commit was ${elapsed}s ago, no wait needed."
          fi

  # ---------------------------------------------------------------------------
  # CI image: R, system libraries and R packages (Dockerfile.ci), tagged with a
  # hash of Dockerfile.ci + install_packages.R. Built and pushed to GHCR only
  # when no image with that tag exists yet, so most runs finish in seconds.
  # ---------------------------------------------------------------------------
  image:
    name: Build CI image
    needs: [ debounce ]
    if: >-
      !cancelled() &&
      (needs.debounce.result == 'success' || needs.debounce.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.tag.outputs.ref }}
    steps:
      - name: Check out the image inputs
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            Dockerfile.ci
            install_packages.R
          sparse-checkout-cone-mode: false

      - name: Work out the image tag
        id: tag
        run: |
          hash=$(cat Dockerfile.ci install_packages.R | sha256sum | cut -c1-16)
          ref="ghcr.io/${GITHUB_REPOSITORY,,}-ci:$hash"   # registry names are lowercase
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Image: $ref" >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Check whether the image already exists
        id: exists
        run: |
          if docker manifest inspect "${{ steps.tag.outputs.ref }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Image exists, nothing to build." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push the image
        if: steps.exists.outputs.found != 'true'
        run: |
          docker build -f Dockerfile.ci -t "${{ steps.tag.outputs.ref }}" .
          docker push "${{ steps.tag.outputs.ref }}"
          echo "Built and pushed the image." >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Checks: one job, run inside the CI image; every check must pass before
  # anything deploys. Each check still runs (and reports) if an earlier one
  # failed.
  # ---------------------------------------------------------------------------
  checks:
    name: R checks
    needs: [ image ]
    # Skipped when the wait was cancelled by a newer push, or the image failed
    if: >-
      !cancelled() &&
      needs.image.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      # github.workspace is the host path inside a container job; the runtime
      # variable is the path the steps actually see
      - name: Point AKILIMO_ROOT at the checkout
        run: echo "AKILIMO_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      # --- Runtime data, ready before any R script runs: the recommendation tests
      # need it (about 560 MB, public on OSF), and the price database test seeds
      # from its CSVs. It is cached under a key made from scripts/.env.example
      # (which holds the OSF node ID), so it is downloaded only when the data
      # release changes; on a cache miss the three steps below fetch it from OSF
      # and save it.
      # translations.csv and fertilizer_npk.csv are tracked in git, so the cache never includes them.
      - name: Restore cached runtime data
        id: data
        if: ${{ !cancelled() }}
        uses: actions/cache/restore@v6
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "5"
        with:
          path: |
            data/yield
            data/soil
            data/input
            !data/input/translations.csv
            !data/input/fertilizer_npk.csv
          key: runtime-data-v1-${{ hashFiles('scripts/.env.example') }}

      - name: Install Python for the data download (cache miss)
        if: ${{ !cancelled() && steps.data.outputs.cache-hit != 'true' }}
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Download runtime data from OSF (cache miss)
        if: ${{ !cancelled() && steps.data.outputs.cache-hit != 'true' }}
        working-directory: scripts
        run: |
          cp .env.example .env
          pipx install poetry
          poetry install --no-interaction
          poetry run setup-data --source osf

      - name: Save runtime data to the cache
        if: ${{ !cancelled() && steps.data.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            data/yield
            data/soil
            data/input
            !data/input/translations.csv
            !data/input/fertilizer_npk.csv
          key: runtime-data-v1-${{ hashFiles('scripts/.env.example') }}

      # Not in the OSF bundle: derived from the RW yield data that is. Built every
      # run, never cached, and skipped when the bundle already has the file.
      - name: Build the Rwanda scheduled-planting file
        if: ${{ !cancelled() }}
        run: sh tools/ensure_sp_files.sh

      - name: Check R syntax
        run: Rscript tests/check_parse.R

      - name: Test price database
        if: ${{ !cancelled() }}
        run: Rscript tests/run_ci_test.R tests/test_akilimo_db.R

      - name: Test request validation
        if: ${{ !cancelled() }}
        run: Rscript tests/run_ci_test.R tests/test_validate_request.R

      - name: Test PDF templates
        if: ${{ !cancelled() }}
        run: Rscript tests/run_ci_test.R tests/test_pdf_template.R

      - name: Test intercrop field-size scaling
        if: ${{ !cancelled() }}
        run: Rscript tests/run_ci_test.R tests/test_ic_units.R

      - name: Test recommendations against the saved baseline
        if: ${{ !cancelled() }}
        run: |
          # The test skips itself without data; in CI missing data is a failure
          test -f data/yield/Nigeria_WLY_LINTUL_2020.RDS || { echo "::error::runtime data missing"; exit 1; }
          Rscript tests/run_ci_test.R tests/test_small.R

      - name: Test Rwanda regressions
        if: ${{ !cancelled() }}
        run: Rscript tests/run_ci_test.R tests/test_rw_regressions.R

  # ---------------------------------------------------------------------------
  # Deploy: a separate workflow (deploy.yml), run only for pushes once every
  # check has passed. On branches without a deploy target it stops after Plan.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: [ checks ]
    if: github.event_name == 'push'
    # The release tag (production) needs to write to the repository
    permissions:
      contents: write
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
