name: Set up R environment
description: >
  Install R and get the API's R packages. The package library is cached under
  a key made from install_packages.R, so it is rebuilt only when that file
  changes (or no cache exists yet).
    install  - restore the cache; on a miss, install system libraries and
               packages, then save the cache. Run once per pipeline run.
    restore  - restore the cache only; fail if it is missing.
    none     - install R only.

inputs:
  packages:
    description: "install | restore | none"
    required: false
    default: "install"

outputs:
  cache-hit:
    description: "'true' when the package library came from the cache unchanged"
    value: ${{ steps.restore.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Install R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: release
        use-public-rspm: true   # prebuilt Linux binaries, much faster installs

    # Exact key only: a change to install_packages.R is a cache miss, so the
    # packages are installed afresh rather than layered on an old library
    - name: Restore cached R packages
      id: restore
      if: inputs.packages != 'none'
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.R_LIBS_USER }}
        key: r-pkgs-${{ runner.os }}-${{ hashFiles('install_packages.R') }}
        fail-on-cache-miss: ${{ inputs.packages == 'restore' }}

    - name: Use cached R packages (install_packages.R unchanged)
      if: inputs.packages == 'install' && steps.restore.outputs.cache-hit == 'true'
      shell: bash
      run: echo "Cache hit for install_packages.R, skipping package installation."

    # --- only on a cache miss -------------------------------------------------
    - name: Install system libraries (GDAL, NetCDF, SQLite)
      if: inputs.packages == 'install' && steps.restore.outputs.cache-hit != 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libgdal-dev libgeos-dev libproj-dev libudunits2-dev \
          libnetcdf-dev libsqlite3-dev libcurl4-openssl-dev

    - name: Install R packages
      if: inputs.packages == 'install' && steps.restore.outputs.cache-hit != 'true'
      shell: bash
      run: Rscript install_packages.R

    - name: Save R packages to the cache
      if: inputs.packages == 'install' && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ env.R_LIBS_USER }}
        key: r-pkgs-${{ runner.os }}-${{ hashFiles('install_packages.R') }}
