name: Set up R environment
description: >
  Install R and get the API's R packages. "install" mode installs the system
  libraries and packages (install_packages.R) and caches the library; it runs
  once per pipeline run. "restore" mode only restores that cached library and
  fails if it is missing. "none" installs R only.

inputs:
  packages:
    description: "install | restore | none"
    required: false
    default: "install"

runs:
  using: composite
  steps:
    - name: Install R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: release
        use-public-rspm: true   # prebuilt Linux binaries, much faster installs

    # --- install: the one job that builds the package library ---------------
    - name: Install system libraries (GDAL, NetCDF, SQLite)
      if: inputs.packages == 'install'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libgdal-dev libgeos-dev libproj-dev libudunits2-dev \
          libnetcdf-dev libsqlite3-dev libcurl4-openssl-dev

    - name: Restore cached R packages
      if: inputs.packages == 'install'
      uses: actions/cache@v4
      with:
        path: ${{ env.R_LIBS_USER }}
        key: r-pkgs-${{ runner.os }}-${{ hashFiles('install_packages.R') }}
        restore-keys: r-pkgs-${{ runner.os }}-

    - name: Install missing R packages
      if: inputs.packages == 'install'
      shell: bash
      run: Rscript install_packages.R

    # --- restore: every other job reuses that library ------------------------
    - name: Restore R packages from the install job
      if: inputs.packages == 'restore'
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.R_LIBS_USER }}
        key: r-pkgs-${{ runner.os }}-${{ hashFiles('install_packages.R') }}
        fail-on-cache-miss: true
