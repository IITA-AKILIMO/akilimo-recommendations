name: Pull runtime data
description: >
  Download the runtime data from OSF into an app folder on the server over
  SSH, using scripts/ and Poetry there. Shared by the pipeline's data job and
  the manual Data setup workflow.

inputs:
  host:
    description: "Server host"
    required: true
  username:
    description: "SSH user"
    required: true
  key:
    description: "SSH private key"
    required: true
  app_dir:
    description: "Application folder on the server"
    required: true
  osf_node_id:
    description: "OSF node ID written to scripts/.env when set"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Download data on the server
      uses: appleboy/ssh-action@v1.2.5
      env:
        APP_DIR: ${{ inputs.app_dir }}
        OSF_NODE_ID: ${{ inputs.osf_node_id }}
      with:
        host: ${{ inputs.host }}
        username: ${{ inputs.username }}
        key: ${{ inputs.key }}
        command_timeout: 40m
        envs: APP_DIR, OSF_NODE_ID
        script: |
          set -e

          cd "$APP_DIR/scripts"

          if [ ! -f ".env" ]; then
            cp .env.example .env
          fi

          if [ -n "$OSF_NODE_ID" ]; then
            sed -i "s/^OSF_NODE_ID=.*/OSF_NODE_ID=$OSF_NODE_ID/" .env
          fi

          # OSF is the single source for runtime data on the servers
          poetry run setup-data --source osf

          # Derived data that is not in the OSF bundle (the Rwanda
          # scheduled-planting file), built from the yield data just pulled
          cd "$APP_DIR"
          sh tools/ensure_sp_files.sh
          echo "Data setup complete (source: osf, dir: $APP_DIR)"
