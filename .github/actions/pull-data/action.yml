name: Pull runtime data
description: >
  Download the runtime data from OSF into an app folder on the server over
  SSH, using scripts/ and Poetry there. Shared by the pipeline's data job and
  the manual Data setup workflow.

inputs:
  host:
    description: "Server host"
    required: true
  username:
    description: "SSH user"
    required: true
  key:
    description: "SSH private key"
    required: true
  app_dir:
    description: "Application folder on the server"
    required: true
  osf_node_id:
    description: "OSF node ID written to scripts/.env when set"
    required: false
    default: ""
  osf_token:
    description: "OSF token for the file listing and the downloads (sent to api.osf.io and files.osf.io only, not written to disk)"
    required: false
    default: ""
  source:
    description: "Where to pull from: github, osf or zenodo; empty = the default source (github)"
    required: false
    default: ""
  data_repo:
    description: "owner/name of the repository whose release holds the data (source github); empty = github.repo in scripts/assets.json"
    required: false
    default: ""
  data_tag:
    description: "Release tag of the data (source github); empty = github.tag in scripts/assets.json"
    required: false
    default: ""
  github_token:
    description: "Token that can read the data repository (Contents: read; it is private); used only with source github"
    required: false
    default: ""
  assets:
    description: "Assets to pull, comma separated (names in scripts/assets.json); empty = the defaults"
    required: false
    default: ""
  exclude_assets:
    description: "Assets to leave out, comma separated; empty = none"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Download data on the server
      uses: appleboy/ssh-action@v1.2.5
      env:
        APP_DIR: ${{ inputs.app_dir }}
        OSF_NODE_ID: ${{ inputs.osf_node_id }}
        OSF_TOKEN: ${{ inputs.osf_token }}
        DATA_SOURCE: ${{ inputs.source }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        GITHUB_DATA_REPO: ${{ inputs.data_repo }}
        GITHUB_DATA_TAG: ${{ inputs.data_tag }}
        ASSETS: ${{ inputs.assets }}
        ASSETS_EXCLUDE: ${{ inputs.exclude_assets }}
      with:
        host: ${{ inputs.host }}
        username: ${{ inputs.username }}
        key: ${{ inputs.key }}
        command_timeout: 40m
        envs: APP_DIR, OSF_NODE_ID, OSF_TOKEN, DATA_SOURCE, GITHUB_TOKEN, GITHUB_DATA_REPO, GITHUB_DATA_TAG, ASSETS, ASSETS_EXCLUDE
        script: |
          set -e

          # A non-interactive SSH shell starts with a short PATH, so a Poetry installed for this
          # user (pipx, the official installer) is not found there although it works in a login
          # shell. Look in the usual places, then for `python3 -m poetry`.
          for d in "$HOME/.local/bin" "$HOME/.poetry/bin" /usr/local/bin /opt/poetry/bin; do
            [ -d "$d" ] && PATH="$PATH:$d"
          done
          export PATH
          if ! command -v poetry >/dev/null 2>&1; then
            if python3 -m poetry --version >/dev/null 2>&1; then
              poetry() { python3 -m poetry "$@"; }
            else
              echo "::error::poetry was not found for $(whoami) on the server (looked in PATH, ~/.local/bin, ~/.poetry/bin, /usr/local/bin, /opt/poetry/bin and python3 -m poetry). Install it for that user, for example: pipx install poetry"
              exit 1
            fi
          fi
          echo "Using $(command -v poetry || echo 'python3 -m poetry')"

          cd "$APP_DIR/scripts"

          if [ ! -f ".env" ]; then
            cp .env.example .env
          fi

          if [ -n "$OSF_NODE_ID" ]; then
            sed -i "s/^OSF_NODE_ID=.*/OSF_NODE_ID=$OSF_NODE_ID/" .env
          fi

          # The source is the DATA_SOURCE repository variable when set (osf or zenodo to go back),
          # else the default of scripts/assets.json: github, the private data repository, read
          # with GITHUB_TOKEN
          poetry run setup-data ${DATA_SOURCE:+--source "$DATA_SOURCE"}

          # Derived data that is not in the OSF bundle (the Rwanda
          # scheduled-planting file), built from the yield data just pulled
          cd "$APP_DIR"
          sh tools/ensure_sp_files.sh
          echo "Data setup complete (source: ${DATA_SOURCE:-default}, dir: $APP_DIR)"
