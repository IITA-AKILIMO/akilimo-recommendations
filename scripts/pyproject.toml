[project]
name = "akilimo_data"
version = "1.0.0"
description = "Data setup and publishing tools for Akilimo Recommendations"
authors = [
    { name = "masgeek", email = "barsamms@gmail.com" }
]
requires-python = ">=3.13,<4"
dependencies = [
    "requests (>=2.33.0,<3.0.0)",
    "tqdm (>=4.67.3,<5.0.0)",
    "click (>=8.3.1,<9.0.0)",
    "rich (>=14.3.3,<15.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)"
]

packages = [{ include = "akilimo_data" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.scripts]
setup-data = "akilimo_data.setup_data:main"
bundle-assets = "akilimo_data.bundle_assets:main"
upload-zenodo = "akilimo_data.upload_zenodo:main"
upload-osf = "akilimo_data.upload_osf:main"