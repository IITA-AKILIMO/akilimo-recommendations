# Build and use the CI image on your own machine (same Dockerfile.ci as CI).
#
#   docker compose build ci            # build akilimo-ci:local
#   docker compose run --rm ci         # shell inside it, repo mounted at /work
#   docker compose run --rm ci Rscript tests/check_parse.R
#   docker compose run --rm ci Rscript tests/run_ci_test.R tests/test_ic_units.R
#
# The tests that need runtime data (test_small.R, test_rw_regressions.R) use
# ./data from this checkout; fetch it first with scripts/ (see CLAUDE.md).
#
# CI does not use this file: it builds Dockerfile.ci itself and pushes the
# image to GHCR (see .github/workflows/ci.yml).
services:
  ci:
    build:
      context: .
      dockerfile: Dockerfile.ci
    # Local tag by default. To name it like CI's image, set CI_IMAGE_TAG to
    # v<IMAGE_VERSION>-<first 16 characters of `git rev-parse HEAD:install_packages.R`>
    image: ${CI_IMAGE_TAG:+ghcr.io/iita-akilimo/akilimo-recommendations-ci:}${CI_IMAGE_TAG:-akilimo-ci:local}
    working_dir: /work
    volumes:
      - .:/work
    environment:
      AKILIMO_ROOT: /work
    command: bash
    stdin_open: true
    tty: true
